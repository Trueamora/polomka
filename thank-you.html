<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to TrueAmora ❤️</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      font-family: Georgia, serif;
      color: #f0cf9b;
      background: radial-gradient(
        circle at center,
        #521c31 0%,
        #240d1a 55%,
        #0e080d 100%
      );
    }

    .card {
      max-width: 550px;
      padding: 45px 25px;
      border: 1px solid #9b7150;
      border-radius: 22px;
      background: rgba(255,255,255,0.035);
    }

    .heart {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    h2 {
      font-size: 24px;
      color: #fff1d5;
      font-weight: normal;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #e9c9a5;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 30px;
      background: #c69a67;
      color: #240d1a;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">❤️</div>

    <h1>WELCOME TO TRUEAMORA</h1>

    <h2>Your Journey to True Love Begins Here.</h2>

    <p>
      Thank you for joining our exclusive waitlist.
      You're now among the first to discover a new
      way to build meaningful, honest connections.
    </p>

    <p>
      We'll let you know when TrueAmora launches.
    </p>

    <a href="/">BACK TO TRUEAMORA</a>
  </main>
</body>
</html>
